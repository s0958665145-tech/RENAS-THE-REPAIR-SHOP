<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>《蕾娜絲的修理小舖-見習手冊》- 9:16 行動裝置閱讀版</title>

  <style>
    :root {
      --bg-color: #06050a;
      --paper-bg: #151221;
      --gold: #d4af37;
      --gold-light: #fef1c9;
      --gold-dark: #8a701e;
      --text-color: #e2dbf0;
      --magic-glow: rgba(212, 175, 55, 0.35);
      --mark-scale: 50%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Georgia", "Noto Serif TC", serif;
      min-height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: env(safe-area-inset-top, 10px) 0 env(safe-area-inset-bottom, 10px) 0;
      touch-action: manipulation;
    }

    /* 開場影片容器 */
    #intro-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1000;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    #intro-layer.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro-video {
      width: min(88vw, 52vh, 420px);
      height: min(156.44vw, 92.4vh, 746px);
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px var(--gold);
    }

    .video-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      color: var(--gold-light);
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
      animation: hintPulseScale 1.8s infinite ease-in-out;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    /* 當加上 hide class 時，強制讓字完全消失且不佔空間 */
    .video-hint.hide {
      opacity: 0 !important;
      visibility: hidden !important;
      animation: none !important;
    }

    @keyframes hintPulseScale {
      0%, 100% {
        opacity: 0.4;
        transform: translate(-50%, -50%) scale(0.92);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    .cover-swipe-hint {
      margin-top: 10px;
      color: var(--gold-light);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-shadow: 0 0 6px var(--gold);
      opacity: 0.85;
      pointer-events: none;
    }

    /* 背景畫布 */
    #magic-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* 頂部快捷章節列 */
    .nav-bar {
      position: fixed;
      top: 12px;
      z-index: 100;
      display: flex;
      gap: 8px;
      background: rgba(21, 18, 33, 0.85);
      border: 1px solid var(--gold-dark);
      border-radius: 20px;
      padding: 6px 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      align-items: center;
    }

    .nav-select {
      background: transparent;
      color: var(--gold-light);
      border: none;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .nav-select option {
      background: var(--paper-bg);
      color: var(--text-color);
    }

    /* 9:16 手機專用 3D 視圖區域 */
    .viewport {
      position: relative;
      z-index: 10;
      perspective: 1500px;
      width: min(88vw, 52vh, 420px);
      height: min(156.44vw, 92.4vh, 746px);
      aspect-ratio: 9 / 16;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
      border-radius: 12px;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .spine {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 10px;
      background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(212,175,55,0.4), rgba(0,0,0,0.4));
      z-index: 200;
      pointer-events: none;
      box-shadow: 2px 0 10px var(--magic-glow);
      border-radius: 8px 0 0 8px;
    }

    /* 單頁結構 */
    .page {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--paper-bg);
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.85), 0 10px 30px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      transform-origin: left center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .page.flipped {
      transform: rotateY(-110deg) scale(0.92);
      opacity: 0;
      pointer-events: none;
    }

    .page.upcoming {
      opacity: 0;
      pointer-events: none;
      transform: rotateY(0deg) scale(0.98);
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      transform: rotateY(0deg) scale(1);
    }

    .content {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      width: 100%; line-height: 1.6; font-size: 0.86rem;
    }

    /* 見習手冊封面圖片按鈕特效 */
    .custom-handbook-btn {
      width: var(--mark-scale);
      height: auto;
      cursor: pointer;
      display: block;
      margin: 0 auto 10px auto;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), filter 0.3s ease;
      animation: handbookPulse 2.5s infinite ease-in-out;
    }

    .custom-handbook-btn:hover {
      transform: scale(1.06);
      filter: drop-shadow(0 0 12px rgba(254, 241, 201, 0.9)) drop-shadow(0 0 22px rgba(212, 175, 55, 0.8));
    }

    .custom-handbook-btn:active {
      transform: scale(0.94);
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.5));
    }

    @keyframes handbookPulse {
      0%, 100% {
        filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 18px rgba(254, 241, 201, 0.85)) drop-shadow(0 0 28px rgba(212, 175, 55, 0.7));
      }
    }

    /* 黃銅金屬銘牌樣式 */
    .brass-plaque-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 48px;
      background: linear-gradient(180deg, #d8b26e 0%, #c49a52 28%, #8f6828 70%, #ba934c 100%);
      border: 2px solid #4a320c;
      border-radius: 4px;
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.6),
        inset 0 0 6px rgba(0, 0, 0, 0.4),
        0 6px 18px rgba(0, 0, 0, 0.85);
      color: #1a1005;
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 6px;
      text-shadow: 0 1px 0 rgba(255, 240, 200, 0.5);
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      outline: none;
    }

    .screw {
      position: absolute;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e0c283 0%, #7a5821 70%, #3d280a 100%);
      top: 50%; transform: translateY(-50%);
    }
    .screw-left { left: 10px; }
    .screw-right { right: 10px; }

    /* 第2頁光球特效 */
    .magic-orb-container {
      position: relative;
      top: -45px;
      width: 200px; height: 200px;
      margin: 15px auto;
      display: flex; justify-content: center; align-items: center;
    }

    .magic-orb {
      width: 160px; height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #fff8dc 0%, #ffe066 30%, #d48e22 60%, #7a4608 90%, transparent 100%);
      box-shadow: 
        0 0 35px rgba(255, 215, 0, 0.95),
        0 0 65px rgba(255, 180, 0, 0.75),
        0 0 95px rgba(212, 175, 55, 0.55),
        inset 0 0 40px rgba(255, 255, 255, 0.9);
      animation: orbPulse 3s infinite ease-in-out;
      position: relative;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.07); filter: brightness(1.25) drop-shadow(0 0 30px #ffe066); }
    }

    /* ===== 第六頁 安全不變形動態火光疊加 ===== */
    .safe-fire-glow {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(255, 160, 30, 0.5) 0%,
        rgba(255, 70, 0, 0.2) 45%,
        transparent 75%
      );
      mix-blend-mode: screen;
      pointer-events: none;
      filter: blur(18px);
      animation: safeGlowPulse 0.22s infinite alternate ease-in-out;
      z-index: 2;
    }

    @keyframes safeGlowPulse {
      0% { opacity: 0.6; transform: translateX(-50%) scale(0.96); }
      100% { opacity: 0.95; transform: translateX(-50%) scale(1.05); }
    }

    .safe-flame-flicker {
      position: absolute;
      top: 13%;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 160px;
      border-radius: 50% 50% 35% 35%;
      background: radial-gradient(
        ellipse at 50% 70%,
        rgba(255, 235, 130, 0.6) 0%,
        rgba(255, 120, 0, 0.35) 45%,
        transparent 80%
      );
      mix-blend-mode: screen;
      pointer-events: none;
      filter: blur(10px);
      animation: safeFlameBurn 0.35s infinite alternate ease-in-out;
      z-index: 3;
    }

    @keyframes safeFlameBurn {
      0% {
        transform: translateX(-50%) translateY(0) scaleX(0.95) scaleY(0.98);
        opacity: 0.7;
      }
      50% {
        transform: translateX(-49%) translateY(-2px) scaleX(1.03) scaleY(1.04);
        opacity: 0.9;
      }
      100% {
        transform: translateX(-51%) translateY(-4px) scaleX(0.97) scaleY(1.08);
        opacity: 1.0;
      }
    }

    .safe-sparks-container {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 200px;
      pointer-events: none;
      z-index: 4;
    }

    .safe-sparks-container span {
      position: absolute;
      bottom: 20px;
      width: 3px;
      height: 3px;
      background: #ffecb3;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffab00, 0 0 10px #ff3d00;
      opacity: 0;
    }

    .active .safe-sparks-container span {
      animation: safeSparkRise 2.5s infinite ease-out;
    }

    .safe-sparks-container span:nth-child(1) { left: 25%; animation-delay: 0s; }
    .safe-sparks-container span:nth-child(2) { left: 45%; animation-delay: 0.6s; width: 4px; height: 4px; }
    .safe-sparks-container span:nth-child(3) { left: 65%; animation-delay: 1.3s; width: 2px; height: 2px; }
    .safe-sparks-container span:nth-child(4) { left: 35%; animation-delay: 1.9s; }
    .safe-sparks-container span:nth-child(5) { left: 55%; animation-delay: 0.9s; width: 3px; height: 3px; }

    @keyframes safeSparkRise {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      25% { opacity: 1; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-140px) translateX(12px) scale(0.2); opacity: 0; }
    }

    /* 全頁佈滿浮動音符特效 */
    .note-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: hidden; z-index: 2;
    }
    .note-container span {
      position: absolute; bottom: -30px; color: var(--gold-light);
      font-size: 1.3rem; opacity: 0; text-shadow: 0 0 12px var(--gold);
    }
    .active .note-container span { animation: floatUpFull 4.5s infinite ease-in-out; }
    .note-container span:nth-child(1) { left: 6%; animation-delay: 0s; }
    .note-container span:nth-child(2) { left: 18%; animation-delay: 1.1s; }
    .note-container span:nth-child(3) { left: 32%; animation-delay: 2.3s; }
    .note-container span:nth-child(4) { left: 45%; animation-delay: 0.5s; }
    .note-container span:nth-child(5) { left: 58%; animation-delay: 3.1s; }
    .note-container span:nth-child(6) { left: 70%; animation-delay: 1.7s; }
    .note-container span:nth-child(7) { left: 82%; animation-delay: 2.8s; }
    .note-container span:nth-child(8) { left: 93%; animation-delay: 0.9s; }

    @keyframes floatUpFull {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(-720px) rotate(45deg); opacity: 0; }
    }

    /* ===== 第 11 頁 安全版 鏡片馬賽克與斷訊特效 ===== */
    .safe-lens-wrapper {
      position: absolute;
      top: 45%;
      left: 55%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 140px;
      pointer-events: none;
      z-index: 5;
    }

    .safe-lens {
      position: absolute;
      top: 22px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4), inset 0 0 8px rgba(255, 215, 0, 0.5);
    }

    .safe-lens-left {
      left: 70px;
      top: 15px;
      transform: rotate(-5deg);
    }

    .safe-lens-right {
      right: 60px;
      top: -10px;
      width: 72px;
      transform: rotate(5deg);
    }

    .safe-mosaic {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(255, 220, 100, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 220, 100, 0.35) 1px, transparent 1px);
      background-size: 8px 8px;
      opacity: 0.5;
      animation: safeMosaicPulse 2s infinite alternate ease-in-out;
    }

    @keyframes safeMosaicPulse {
      0% { opacity: 0.3; background-size: 8px 8px; }
      50% { opacity: 0.7; background-size: 6px 6px; }
      100% { opacity: 0.4; background-size: 10px 10px; }
    }

    .safe-scan {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 245, 180, 0.9);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.9);
      animation: safeScanMove 2.2s infinite linear;
    }

    @keyframes safeScanMove {
      0% { top: -10%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 110%; opacity: 0; }
    }

    .safe-glitch {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 230, 120, 0.2);
      opacity: 0;
      animation: safeGlitchFlash 3.2s infinite ease-in-out;
    }

    @keyframes safeGlitchFlash {
      0%, 88%, 100% { opacity: 0; transform: translate(0, 0); }
      89% { opacity: 0.7; transform: translate(-3px, 2px); }
      91% { opacity: 0.2; transform: translate(3px, -1px); }
      92% { opacity: 0.85; transform: translate(-2px, -2px); }
      94% { opacity: 0.1; transform: translate(1px, 2px); }
      96% { opacity: 0.75; transform: translate(2px, 1px); }
      98% { opacity: 0; transform: translate(0, 0); }
    }

    /* ===== 第 23 頁 安全防裁切 CSS ===== */
    .page-wand-23 {
      position: relative;
      overflow: hidden !important;
      box-sizing: border-box;
    }

    /* ===== 第 28 頁 盛魂器動態效果 ===== */
    .page-jars-28 {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden !important;
      box-sizing: border-box;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      padding: 0 !important;
    }

    .page-jars-28 .content {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      margin: 0; padding: 0;
    }

    .jar-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 220, 110, 0.7) 0%, rgba(255, 170, 30, 0.35) 50%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 2;
      filter: blur(12px);
      animation: jarGlowPulse 1.6s infinite alternate ease-in-out;
    }

    .glow-left { top: 28%; left: 16%; width: 100px; height: 110px; animation-delay: 0s; }
    .glow-center { top: 30%; left: 38%; width: 110px; height: 120px; animation-delay: 0.5s; }
    .glow-right { top: 22%; left: 63%; width: 105px; height: 115px; animation-delay: 1.0s; }

    @keyframes jarGlowPulse {
      0% { opacity: 0.3; transform: scale(0.85); filter: blur(14px) brightness(0.8); }
      100% { opacity: 1; transform: scale(1.25); filter: blur(8px) brightness(1.5); }
    }

    /* ===== 第 34 頁 沙漏與由上往下橫向旋轉光束動態效果 ===== */
    .page-hourglass-34 {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden !important;
      box-sizing: border-box;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      padding: 0 !important;
    }

    .page-hourglass-34 .content {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      margin: 0; padding: 0;
    }

    .hourglass-center-glow {
      position: absolute;
      top: 42%; left: 50%;
      transform: translate(-50%, -50%);
      width: 130px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 160, 0, 0.15) 50%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 2;
      filter: blur(10px);
      animation: hourglassGlowPulse 2.5s infinite alternate ease-in-out;
    }

    @keyframes hourglassGlowPulse {
      0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
      100% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.1); }
    }
  </style>
</head>

<body>

  <canvas id="magic-canvas"></canvas>

  <div class="nav-bar">
    <span style="color:var(--gold); font-size:0.8rem;">📖 章節:</span>
    <select id="pageSelect" class="nav-select" onchange="jumpToPage(this.value)"></select>
  </div>

  <div id="intro-layer">
    <video id="intro-video" playsinline preload="auto">
      <source src="00封面.mp4" type="video/mp4">
    </video>
    <div class="video-hint">點擊開始修復之旅</div>
  </div>

  <div class="viewport" id="viewport">
    <div class="book">
      <div class="spine"></div>

      <!-- 第 1 頁：封面 -->
      <div class="page active" style="background-image: url('cover.png'); background-size: cover; background-position: center;">
        <div class="content" style="justify-content: flex-end; padding-bottom: 20px;">
          <img src="mark.png" alt="見習手冊" class="custom-handbook-btn" onclick="handlePlaqueClick(event)">
          <div class="cover-swipe-hint">【向左滑動修復啟程】</div>
        </div>
      </div>

      <!-- 第 2 頁：匠人手稿（光球） -->
      <div class="page upcoming" style="background-image: url('page_2.png'); background-size: cover; background-position: center;">
        <div class="content" style="justify-content: center;">
          <div class="magic-orb-container">
            <div class="magic-orb"></div>
          </div>
        </div>
      </div>

      <!-- 第 3 頁：引光入行者 -->
      <div class="page upcoming" style="background-image: url('page_3.png'); background-size: cover; background-position: center;">
        <div class="content"></div>
      </div>

      <!-- 第 4 頁：藍圖繪製者 -->
      <div class="page upcoming" style="background-image: url('page_4.png'); background-size: cover; background-position: center;">
        <div class="content"></div>
      </div>

      <!-- 第 5 頁：音域調頻者 -->
      <div class="page upcoming" style="background-image: url('page_5.png'); background-size: cover; background-position: center;">
        <div class="content"></div>
      </div>

      <!-- 第 6 頁：熔爐 -->
      <div class="page upcoming" style="background-image: url('page_6.png'); background-size: cover; background-position: center;">
        <div class="safe-fire-glow"></div>
        <div class="safe-flame-flicker"></div>
        <div class="safe-sparks-container">
          <span></span><span></span><span></span><span></span><span></span>
        </div>

    function playChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    introLayer.addEventListener('click', () => {
      if (isPlaying) return;
      isPlaying = true;

      // 2. 稍等一小段時間讓文字消失後，才開始播放影片
      setTimeout(() => {

      }, 150);

    /* 背景與翻頁魔法粒子 */
    const canvas = document.getElementById('magic-canvas');
    const ctx = canvas.getContext('2d');
    let bgParticles = [], flipParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class BgParticle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 3.5 + 0.8;
        this.speedY = -(Math.random() * 1.0 + 0.3);
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.alpha = Math.random() * 0.7 + 0.3;
        this.pulse = Math.random() * 0.03 + 0.008;
        const colors = ['212, 175, 55', '255, 238, 88', '230, 210, 255', '255, 255, 255'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) * this.speedX;
        this.alpha += Math.sin(this.y * 0.05) * this.pulse;
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${Math.max(0, Math.min(1, this.alpha))})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = `rgba(${this.color}, 0.9)`;
        ctx.fill();
        ctx.restore();
      }
    }
    for (let i = 0; i < 150; i++) bgParticles.push(new BgParticle());

    class FlipParticle {
      constructor(startX, startY) {
        this.x = startX + (Math.random() - 0.5) * 120;
        this.y = startY + (Math.random() - 0.5) * 120;
        this.radius = Math.random() * 5.5 + 1.5;
        this.speedX = (Math.random() - 0.5) * 18;
        this.speedY = (Math.random() - 0.5) * 18 - 3;
        this.alpha = 1.0;
        this.decay = Math.random() * 0.004 + 0.002;
        const colors = ['212, 175, 55', '255, 215, 0', '255, 238, 88', '255, 255, 255', '200, 180, 255'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.speedX *= 0.95;
        this.speedY = this.speedY * 0.95 - 0.08;
        this.alpha -= this.decay;
      }
      draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = `rgba(${this.color}, ${this.alpha})`;
        ctx.fill();
        ctx.restore();
      }
    }

    function triggerMagicBurst() {
      const rect = document.getElementById('viewport').getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      for (let i = 0; i < 180; i++) flipParticles.push(new FlipParticle(cx, cy));
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bgParticles.forEach(p => { p.update(); p.draw(); });
      for (let i = flipParticles.length - 1; i >= 0; i--) {
        flipParticles[i].update();
        flipParticles[i].draw();
        if (flipParticles[i].alpha <= 0) flipParticles.splice(i, 1);
      }
      requestAnimationFrame(animate);
    }

    function initPageSelect() {

        select.appendChild(option);
      });

    function updatePages() {
      pages.forEach((page, index) => {
        page.classList.remove('active', 'flipped', 'upcoming');
        if (index < currentPage) {
          page.classList.add('flipped');
          page.style.zIndex = index + 1;
        } else if (index === currentPage) {
          page.classList.add('active');
          page.style.zIndex = 100;
        } else {
          page.classList.add('upcoming');
          page.style.zIndex = totalPages - index;
        }
      });
      document.getElementById('pageSelect').value = currentPage;
    }

    function nextPage() {
      if (currentPage < totalPages - 1) {
        currentPage++;
        updatePages();
        triggerMagicBurst();
        playChime();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        updatePages();
        triggerMagicBurst();
        playChime();
      }

      currentPage = parseInt(index);

    let startX = 0, startY = 0;
    let lastTouchTime = 0;
    const vp = document.getElementById('viewport');
    
    vp.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    vp.addEventListener('touchend', e => {
      const dx = startX - e.changedTouches[0].clientX;
      const dy = startY - e.changedTouches[0].clientY;
      if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) {
        lastTouchTime = Date.now();
        if (dx > 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    vp.addEventListener('click', e => {
      if (Date.now() - lastTouchTime < 500) return;
      
      const rect = vp.getBoundingClientRect();
      if ((e.clientX - rect.left) > rect.width * 0.45) nextPage();
      else prevPage();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    updatePages();

    /* ===== 第 23 頁 魔杖動態環繞光點系統 ===== */
    (function initWandCanvas() {
      const canvas = document.getElementById('wandMagicCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = canvas.clientWidth || canvas.offsetWidth || 300;
        canvas.height = canvas.clientHeight || canvas.offsetHeight || 533;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const particleCount = 20;
      const particles = [];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          angle: Math.random() * Math.PI * 2,
          speed: 0.02 + Math.random() * 0.025,
          radiusX: 50 + Math.random() * 40,
          radiusY: 110 + Math.random() * 60,
          size: 1.5 + Math.random() * 2.5,
          alpha: 0.3 + Math.random() * 0.7,
          pulseSpeed: 0.03 + Math.random() * 0.03
        });
      }

      let orbPulse = 0;

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width * 0.52;
        const centerY = canvas.height * 0.38;

        orbPulse += 0.04;
        const orbGlowSize = 25 + Math.sin(orbPulse) * 4;
        const orbX = canvas.width * 0.68;
        const orbY = canvas.height * 0.18;

        const orbGradient = ctx.createRadialGradient(orbX, orbY, 2, orbX, orbY, orbGlowSize);
        orbGradient.addColorStop(0, 'rgba(255, 250, 210, 0.9)');
        orbGradient.addColorStop(0.4, 'rgba(255, 215, 0, 0.5)');
        orbGradient.addColorStop(0.8, 'rgba(255, 160, 0, 0.15)');
        orbGradient.addColorStop(1, 'rgba(255, 160, 0, 0)');

        ctx.fillStyle = orbGradient;
        ctx.beginPath();
        ctx.arc(orbX, orbY, orbGlowSize, 0, Math.PI * 2);
        ctx.fill();

        particles.forEach((p) => {
          p.angle += p.speed;
          p.alpha += Math.sin(p.angle * 2) * 0.01;

          const rawX = Math.cos(p.angle) * p.radiusX;
          const rawY = Math.sin(p.angle) * p.radiusY;

          const rot = -35 * (Math.PI / 180);
          const x = centerX + (rawX * Math.cos(rot) - rawY * Math.sin(rot));
          const y = centerY + (rawX * Math.sin(rot) + rawY * Math.cos(rot));

          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 235, 150, ${Math.max(0.2, Math.min(1, p.alpha))})`;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        });

        requestAnimationFrame(render);
      }

      render();
    })();

    /* ===== 第 28 頁 盛魂器玻璃瓶內靈魂碎片特效 ===== */
    (function initSoulShardCanvas() {
      const canvas = document.getElementById('soulShardCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = canvas.clientWidth || canvas.offsetWidth || 300;
        canvas.height = canvas.clientHeight || canvas.offsetHeight || 533;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const jarCenters = [
        { xRatio: 0.26, yRatio: 0.36, radiusX: 38, radiusY: 48 },
        { xRatio: 0.50, yRatio: 0.39, radiusX: 42, radiusY: 52 },
        { xRatio: 0.74, yRatio: 0.31, radiusX: 40, radiusY: 50 }
      ];

      const shards = [];
      const shardCount = 42;

      for (let i = 0; i < shardCount; i++) {
        const jarIndex = i % 3;
        shards.push({
          jarIndex: jarIndex,
          offsetX: (Math.random() - 0.5) * 1.5,
          offsetY: (Math.random() - 0.5) * 1.5,
          size: 3.2 + Math.random() * 4.5,
          speedY: 0.15 + Math.random() * 0.3,
          speedX: (Math.random() - 0.5) * 0.18,
          angle: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.06,
          alpha: 0.4 + Math.random() * 0.6,
          pulseSpeed: 0.04 + Math.random() * 0.05,
          type: Math.random() > 0.4 ? 'diamond' : 'star'
        });
      }

      function drawDiamond(ctx, x, y, size, angle, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, -size * 1.4);
        ctx.lineTo(size * 0.9, 0);
        ctx.lineTo(0, size * 1.4);
        ctx.lineTo(-size * 0.9, 0);
        ctx.closePath();

        ctx.fillStyle = `rgba(255, 252, 210, ${alpha})`;
        ctx.shadowColor = '#fff066';
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.restore();
      }

      function drawStar(ctx, x, y, size, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.lineTo(0, -size * 1.6);
          ctx.lineTo(size * 0.25, -size * 0.25);
        }
        ctx.closePath();
        ctx.fillStyle = `rgba(255, 255, 240, ${alpha})`;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        shards.forEach((s) => {
          const jar = jarCenters[s.jarIndex];
          const centerX = canvas.width * jar.xRatio;
          const centerY = canvas.height * jar.yRatio;

          s.offsetY -= s.speedY * 0.012;
          s.offsetX += Math.sin(s.angle) * s.speedX * 0.01;
          s.angle += s.rotSpeed;
          s.alpha += Math.sin(s.angle * 3) * s.pulseSpeed;

          if (Math.abs(s.offsetY) > 0.8 || Math.abs(s.offsetX) > 0.75) {
            s.offsetY = 0.65;
            s.offsetX = (Math.random() - 0.5) * 1.1;
          }

          const x = centerX + s.offsetX * jar.radiusX;
          const y = centerY + s.offsetY * jar.radiusY;
          const currentAlpha = Math.max(0.2, Math.min(1.0, s.alpha));

          if (s.type === 'diamond') {
            drawDiamond(ctx, x, y, s.size, s.angle, currentAlpha);
          } else {
            drawStar(ctx, x, y, s.size, currentAlpha);
          }
        });

        requestAnimationFrame(render);
      }

      render();
    })();

    /* ===== 第 34 頁 沙漏流沙與光束特效 ===== */
    (function initHourglassCanvas() {
      const canvas = document.getElementById('hourglassCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = canvas.clientWidth || canvas.offsetWidth || 300;
        canvas.height = canvas.clientHeight || canvas.offsetHeight || 533;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const sandParticles = [];
      const sandCount = 45;

      for (let i = 0; i < sandCount; i++) {
        sandParticles.push({
          xOffset: (Math.random() - 0.5) * 4,
          yProgress: Math.random(),
          speed: 0.012 + Math.random() * 0.018,
          size: 1.0 + Math.random() * 1.8,
          alpha: 0.4 + Math.random() * 0.6
        });
      }

      const spiralParticles = [];
      const particleCount = 10;

      for (let i = 0; i < particleCount; i++) {
        spiralParticles.push({
          angle: Math.random() * Math.PI * 2,
          rotSpeed: 0.012 + Math.random() * 0.01,
          yProgress: Math.random(),
          fallSpeed: 0.0012 + Math.random() * 0.001,
          radiusX: 110 + Math.random() * 27,
          radiusY: 28 + Math.random() * 14,
          size: 1.5 + Math.random() * 2,
          alpha: 0.3 + Math.random() * 0.7
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width * 0.50;
        const topY = canvas.height * 0.16;
        const bottomY = canvas.height * 0.68;
        const neckY = canvas.height * 0.435;

        sandParticles.forEach((p) => {
          p.yProgress += p.speed;
          if (p.yProgress > 1) {
            p.yProgress = 0;
            p.xOffset = (Math.random() - 0.5) * 4;
          }

          const currentY = neckY + (canvas.height * 0.61 - neckY) * p.yProgress;
          const spread = p.xOffset * (1 + p.yProgress * 3.5);
          const currentX = centerX + spread;

          ctx.save();
          ctx.beginPath();
          ctx.arc(currentX, currentY, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 235, 140, ${p.alpha})`;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 6;
          ctx.fill();
          ctx.restore();
        });

        spiralParticles.forEach((p) => {
          p.angle += p.rotSpeed;
          p.yProgress += p.fallSpeed;

          if (p.yProgress > 1) {
            p.yProgress = 0;
            p.angle = Math.random() * Math.PI * 2;
          }

          const currentY = topY + (bottomY - topY) * p.yProgress;
          const waistFactor = Math.sin(p.yProgress * Math.PI);
          const dynamicRadiusX = p.radiusX * (1 - waistFactor * 0.28);

          const rawX = Math.cos(p.angle) * dynamicRadiusX;
          const rawY = Math.sin(p.angle) * p.radiusY;

          const x = centerX + rawX;
          const y = currentY + rawY;

          const depth = Math.sin(p.angle);
          const currentAlpha = Math.max(0.15, Math.min(0.95, p.alpha + depth * 0.25));
          const currentSize = Math.max(1.0, p.size + depth * 0.7);

          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, currentSize, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 245, 180, ${currentAlpha})`;
          ctx.shadowColor = '#ffe066';
          ctx.shadowBlur = depth > 0 ? 14 : 3;
          ctx.fill();
          ctx.restore();
        });

        requestAnimationFrame(render);
      }

      render();
    })();
  </script>
</body>
